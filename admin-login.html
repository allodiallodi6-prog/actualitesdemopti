<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Espace rédaction | Actualités de Mopti</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="logo" style="margin-bottom:26px; justify-content:center;">
      <svg class="logo-mark" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="30" cy="30" r="30" fill="#0E5C7A"/>
        <path d="M10 40 C 18 34, 26 44, 34 38 C 42 32, 50 40, 54 36" stroke="#4FAE72" stroke-width="3" fill="none"/>
        <path d="M22 32 L30 18 L38 32 Z" fill="#E8C79A"/>
        <rect x="27" y="30" width="6" height="10" fill="#E8C79A"/>
      </svg>
      <div class="logo-text"><div class="top">Actualités de <span>Mopti</span></div><div class="sub">Espace rédaction</div></div>
    </div>
    <form onsubmit="event.preventDefault(); window.location.href='admin-dashboard.html';">
      <div class="field"><label>Identifiant</label><input type="text" placeholder="nom.utilisateur" required></div>
      <div class="field"><label>Mot de passe</label><input type="password" placeholder="••••••••" required></div>
      <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">Se connecter</button>
    </form>
    <p style="font-size:12px; color:var(--texte-att); text-align:center; margin-top:18px;">Accès réservé à l'équipe de rédaction. En cas d'oubli, contactez l'administrateur du site.</p>
    <p style="text-align:center; margin-top:14px;"><a href="index.html" style="font-size:12.5px; color:var(--accent);">← Retour au site</a></p>
  </div>
</div>
</body>
</html>
