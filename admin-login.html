<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte de Mopti — Actualités de Mopti</title>
<meta name="description" content="Carte interactive de la ville de Mopti (quartiers) et de la région de Mopti (cercles) après la réforme territoriale de 2023.">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<style>
  :root{
    --navy:#0B3D52;
    --green:#3FA13A;
    --bg:#f5f7f8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:#1a1a1a;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:1rem 1.25rem;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:1rem;
    flex-wrap:wrap;
  }
  header h1{
    margin:0;
    font-size:1.25rem;
  }
  header p{
    margin:.25rem 0 0;
    font-size:.85rem;
    color:#cfe3ea;
  }
  header a.retour{
    color:#cfe3ea;
    font-size:.85rem;
    text-decoration:none;
    white-space:nowrap;
    padding-top:.15rem;
  }
  header a.retour:hover{
    color:#fff;
    text-decoration:underline;
  }
  .toolbar{
    display:flex;
    gap:.5rem;
    flex-wrap:wrap;
    padding:.75rem 1.25rem;
    background:#fff;
    border-bottom:1px solid #e2e2e2;
  }
  .toolbar button{
    border:1px solid var(--navy);
    background:#fff;
    color:var(--navy);
    padding:.5rem .9rem;
    border-radius:999px;
    font-size:.85rem;
    cursor:pointer;
    transition:.15s;
  }
  .toolbar button.active,
  .toolbar button:hover{
    background:var(--navy);
    color:#fff;
  }
  #map{
    width:100%;
    height:70vh;
    min-height:420px;
  }
  .legend{
    padding:.75rem 1.25rem;
    font-size:.8rem;
    color:#555;
    background:#fff;
  }
  .legend span{
    display:inline-flex;
    align-items:center;
    gap:.35rem;
    margin-right:1.25rem;
  }
  .dot{
    width:10px;height:10px;border-radius:50%;display:inline-block;
  }
  .dot.quartier{background:var(--green);}
  .dot.cercle{background:var(--navy);}
  .leaflet-popup-content b{color:var(--navy);}
</style>
</head>
<body>

<header>
  <div>
    <h1>Carte de Mopti</h1>
    <p>Quartiers de la ville et cercles de la région (découpage administratif post-2023)</p>
  </div>
  <a href="index.html" class="retour">← Retour au site</a>
</header>

<div class="toolbar">
  <button id="btn-quartiers" class="active">Quartiers de la ville</button>
  <button id="btn-cercles">Cercles de la région</button>
  <button id="btn-tous">Tout afficher</button>
</div>

<div id="map"></div>

<div class="legend">
  <span><i class="dot quartier"></i>Quartier de Mopti ville</span>
  <span><i class="dot cercle"></i>Cercle de la région</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
// --- Données : quartiers de la commune urbaine de Mopti ---
const quartiers = [
  { nom: "Komoguel I & II", lat: 14.4944, lng: -4.1939, info: "Siège de l'Hôtel de Ville, Grande Mosquée de Komoguel (1936-1943)." },
  { nom: "Gangal",            lat: 14.4897, lng: -4.1943, info: "Quartier riverain, proche du port." },
  { nom: "Toguel",            lat: 14.4926, lng: -4.1904, info: "" },
  { nom: "Bougoufié",         lat: 14.4869, lng: -4.1879, info: "" },
  { nom: "Mossinkoré",        lat: 14.4854, lng: -4.1904, info: "" },
  { nom: "Taïkiri",           lat: 14.4797, lng: -4.1815, info: "" },
  { nom: "Médina-coura",      lat: 14.4633, lng: -4.1640, info: "" },
  { nom: "Sévaré I, II, III", lat: 14.5241, lng: -4.0951, info: "Ville jumelle de Mopti, aéroport et carrefour routier." }
];

// --- Données : cercles de la région de Mopti (depuis la réforme de 2023) ---
const cercles = [
  { nom: "Mopti (01)",             lat: 14.4901, lng: -4.1925, info: "Chef-lieu de la région." },
  { nom: "Djenné (02)",            lat: 13.9054, lng: -4.5560, info: "" },
  { nom: "Ténenkou (03)",          lat: 14.4590, lng: -4.9169, info: "" },
  { nom: "Youwarou (04)",          lat: 15.3750, lng: -4.2615, info: "" },
  { nom: "Konna (05)",             lat: 14.9438, lng: -3.8935, info: "" },
  { nom: "Korientzé (06)",         lat: 15.3973, lng: -3.7819, info: "" },
  { nom: "Sofara (07)",            lat: 14.0199, lng: -4.2256, info: "" },
  { nom: "Toguéré-Coumbé (08)",    lat: 14.9214, lng: -4.5914, info: "" }
];

const map = L.map('map').setView([14.62, -4.35], 8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

function makeIcon(color){
  return L.divIcon({
    className: '',
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.4);"></div>`,
    iconSize: [16,16],
    iconAnchor: [8,8]
  });
}

const quartierIcon = makeIcon('#3FA13A');
const cercleIcon = makeIcon('#0B3D52');

const quartierLayer = L.layerGroup(
  quartiers.map(q => L.marker([q.lat, q.lng], {icon: quartierIcon})
    .bindPopup(`<b>${q.nom}</b>${q.info ? '<br>' + q.info : ''}`))
);

const cercleLayer = L.layerGroup(
  cercles.map(c => L.marker([c.lat, c.lng], {icon: cercleIcon})
    .bindPopup(`<b>${c.nom}</b>${c.info ? '<br>' + c.info : ''}`))
);

quartierLayer.addTo(map);

const btnQuartiers = document.getElementById('btn-quartiers');
const btnCercles = document.getElementById('btn-cercles');
const btnTous = document.getElementById('btn-tous');

function setActive(btn){
  [btnQuartiers, btnCercles, btnTous].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

btnQuartiers.addEventListener('click', () => {
  map.removeLayer(cercleLayer);
  quartierLayer.addTo(map);
  map.setView([14.50, -4.17], 12);
  setActive(btnQuartiers);
});

btnCercles.addEventListener('click', () => {
  map.removeLayer(quartierLayer);
  cercleLayer.addTo(map);
  map.setView([14.9, -4.3], 8);
  setActive(btnCercles);
});

btnTous.addEventListener('click', () => {
  quartierLayer.addTo(map);
  cercleLayer.addTo(map);
  map.setView([14.7, -4.3], 8);
  setActive(btnTous);
});
</script>

</body>
</html>
